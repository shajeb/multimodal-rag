[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-research-rag"
version = "0.1.0"
description = "Multimodal PDF RAG with hybrid retrieval, memory and tenant isolation"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.25,<2", "pdfplumber>=0.11,<1",
  "langchain-core>=1,<2", "chromadb>=1,<2", "sentence-transformers>=3,<6",
  "google-genai>=1,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2",
  "streamlit>=1.40,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1"
]

[project.optional-dependencies]
samples = ["reportlab>=4,<5", "matplotlib>=3.8,<4"]
cloud = ["pinecone>=7,<9", "redis>=5,<8"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
multimodal-rag = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
